{% extends 'base.html' %}
{% block title %}Видалити {{ type }} — TeamForge{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <i class="bi bi-trash3 text-danger fs-1 mb-3"></i>
      <h4 class="fw-bold mb-2">Видалити {{ type }}?</h4>
      <p class="text-muted mb-4">«{{ object }}»<br>Цю дію неможливо скасувати.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
          <button type="submit" class="btn btn-danger px-4">Так, видалити</button>
          <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Скасувати</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
